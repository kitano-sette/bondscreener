<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bond Daily Highlight</title>
<link rel="preconnect" href="https://googleapis.com">
<link href="https://googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Anton&family=Kanit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brown:#4A3A34;
    --amber1:#F6A93B;
    --amber2:#E8862A;
    --maroon:#6E2E32;
    --cream:#FBF6EC;
    --paper:#FFFFFF;
    --ink:#332621;
    --ink-soft:#7A6B62;
    --line:#EAE0CF;
    --gold:#C98A12;
    --green:#4C8B3B;
    --red:#B4432E;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    font-family:'Noto Sans Thai', sans-serif;
    background:var(--cream);
    color:var(--ink);
    padding-bottom:40px;
  }

  /* ---------- Header ---------- */
  .hero{
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(600px 300px at 15% 10%, rgba(255,255,255,0.25), transparent 60%),
      linear-gradient(120deg,#F2A63C 0%,#E8862A 45%, #D9691F 100%);
    padding:18px 16px 46px;
  }
  .coin{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #FFE9B0, #D89A2D 60%, #A8700F 100%);
    box-shadow:inset -4px -6px 10px rgba(0,0,0,0.25), 0 6px 14px rgba(0,0,0,0.2);
    opacity:0.9;
  }
  .coin.c1{width:44px; height:44px; top:14px; right:16px;}
  .coin.c2{width:24px; height:24px; top:70px; right:70px;}
  .coin.c3{width:30px; height:30px; bottom:2px; left:4%;}

  .title-block{
    text-align:center;
    margin-top:14px;
    position:relative; z-index:2;
  }
  .title-main{
    font-family:'Anton', 'Kanit', sans-serif;
    font-size:clamp(30px,10vw,40px);
    color:#fff;
    letter-spacing:2px;
    -webkit-text-stroke:1.5px rgba(110,46,50,0.55);
    text-shadow:0 4px 0 rgba(110,46,50,0.35);
    margin:0;
  }
  .title-byline{
    text-align:center;
    margin-top:4px;
    font-family:'Noto Sans Thai', sans-serif;
    font-weight:600;
    font-size:11px;
    color:rgba(255,255,255,0.85);
    letter-spacing:.3px;
  }
  .title-sub{
    display:inline-block;
    margin-top:6px;
    font-family:'Kanit', sans-serif;
    font-weight:700;
    font-size:clamp(16px,5vw,20px);
    color:var(--maroon);
    background:linear-gradient(100deg,#F7C9CE,#F3E3B0);
    padding:4px 20px;
    border-radius:6px;
    transform:rotate(-2deg);
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
  }

  /* ---------- Panel ---------- */
  .panel{
    max-width:600px;
    margin:-26px auto 0;
    background:var(--paper);
    border-radius:18px;
    box-shadow:0 20px 40px -24px rgba(74,58,52,0.45);
    padding:18px 14px 24px;
    position:relative;
    z-index:3;
  }
  .panel-top{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:8px;
    margin-bottom:16px;
  }
  .flag{
    background:linear-gradient(100deg,#FBE28A,#F5C542);
    color:var(--maroon);
    font-weight:700; font-size:14px;
    padding:9px 14px;
    border-radius:8px;
    transform:rotate(-1.5deg);
    box-shadow:0 6px 12px rgba(0,0,0,0.12);
  }
  .date-pill{
    background:#EFEAE0;
    color:var(--brown);
    font-weight:700; font-size:13px;
    padding:9px 16px;
    border-radius:999px;
  }

  /* ---------- Search box ---------- */
  .search-box{
    position:relative;
    margin-bottom:10px;
  }
  .search-box input{
    width:100%;
    font-family:inherit; font-size:13px; color:var(--ink);
    border:1px solid var(--line); border-radius:9px;
    padding:10px 12px 10px 34px;
    background:#fff;
  }
  .search-box input:focus-visible{outline:2px solid var(--amber2); outline-offset:1px;}
  .search-box .search-icon{
    position:absolute; left:11px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; pointer-events:none;
  }
  .search-box .search-icon svg{width:100%; height:100%; display:block;}

  /* ---------- Filters ---------- */
  .filters{
    display:grid; grid-template-columns:1fr 1fr; gap:8px;
    padding:12px; background:#FBF8F1;
    border:1px solid var(--line); border-radius:12px;
    margin-bottom:16px;
  }
  .filters select{
    appearance:none; -webkit-appearance:none;
    font-family:inherit;
    background:#fff url('data:image/svg+xml;utf8,<svg xmlns="http://w3.org" width="12" height="8"><path d="M1 1l5 5 5-5" stroke="%237A6B62" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 10px center;
    border:1px solid var(--line);
    border-radius:9px;
    padding:9px 26px 9px 10px;
    font-size:12.5px;
    color:var(--ink);
    cursor:pointer;
    width:100%;
  }
  .filters select:focus-visible{outline:2px solid var(--amber2); outline-offset:1px;}
  .reset-btn{
    grid-column:1 / -1;
    background:var(--maroon); color:#fff; border:none;
    padding:9px; border-radius:9px; font-size:12.5px;
    cursor:pointer; font-family:inherit; font-weight:600;
  }
  .reset-btn:hover{background:#5a2529;}

  .count-line{
    font-size:12.5px; color:var(--ink-soft); margin-bottom:10px; padding:0 2px;
  }
  .count-line b{color:var(--brown);}
  .disclaimer-line{
    font-size:11px; color:#c0392b; margin:2px 2px 10px 2px;
  }

  /* ---------- Bond cards ---------- */
  .cards{display:flex; flex-direction:column; gap:12px;}
  .card{
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    background:var(--paper);
  }
  .card-head{display:flex; justify-content:space-between; gap:8px; align-items:flex-start;}
  .bond-name{font-weight:700; color:var(--brown); font-size:16px;}
  .bond-name .star{color:var(--gold); margin-right:4px;}
  .new-badge{
    display:block;
    width:fit-content;
    font-size:10px;
    font-weight:800;
    letter-spacing:.4px;
    color:#fff;
    background:linear-gradient(100deg,#FF6B4A,#FFB300);
    padding:2px 7px;
    border-radius:999px;
    margin-bottom:4px;
    box-shadow:0 2px 6px -2px rgba(184,92,46,0.6);
  }
  .bond-issuer{font-size:12px; color:var(--ink-soft); margin-top:2px; line-height:1.4;}
  .bond-rights{font-size:12px; color:#7A1F1F; margin-top:3px; line-height:1.4; font-weight:600;}
  
  .ytm-box{text-align:right; flex:none;}
  .ytm-box .lbl{font-size:10px; color:var(--ink-soft); margin-bottom:2px;}
  .ytm{
    background:#F6D746; font-weight:800; color:var(--ink);
    padding:5px 11px; border-radius:6px; display:inline-block;
    font-size:16px; white-space:nowrap;
  }

  .metrics-grid{
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:8px; margin-top:12px;
    border-top:1px dashed var(--line); padding-top:12px;
  }
  .metric .m-lbl{font-size:10px; color:var(--ink-soft); margin-bottom:3px;}
  .metric .m-val{font-size:13.5px; font-weight:700; color:var(--ink);}

  .card-foot{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin-top:12px;
  }
  
  /* ---------- Button & Action ---------- */
  .buy-btn{
    flex:none;
    background:linear-gradient(135deg, var(--amber1) 0%, var(--amber2) 100%);
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 6px rgba(232, 134, 42, 0.2);
    transition: all 0.2s ease;
  }
  .buy-btn:hover{
    transform: translateY(-1px);
    box-shadow: 0 6px 12px rgba(232, 134, 42, 0.35);
  }
  .buy-btn:active{
    transform: translateY(1px);
  }
</style>
</head>
<body>

<div class="hero">
  <div class="coin c1"></div>
  <div class="coin c2"></div>
  <div class="coin c3"></div>
  <div class="title-block">
    <h1 class="title-main">BOND SCREENER</h1>
    <div class="title-byline">Secondary Market</div>
    <div class="title-sub">★ Daily Highlight</div>
  </div>
</div>

<div class="panel">
  <div class="panel-top">
    <div class="flag">เสนอขาย (หุ้นกู้ตลาดรอง)</div>
    <div class="date-pill">5 สิงหาคม 2569</div>
  </div>

  <!-- Search Box -->
  <div class="search-box">
    <div class="search-icon">
      <svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="#7A6B62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    </div>
    <input type="text" placeholder="ค้นหาชื่อหุ้นกู้ หรือชื่อบริษัทย่อ...">

  <!-- Filters -->
  <div class="filters">

      <option value="">YTM: ทั้งหมด</option>

      <option value="3-4">3-4%</option>
      <option value="2-3">2-3%</option>
      <option value="2">น้อยกว่า 2%</option>
    </select>

    <select id="filter-years">
      <option value="">อายุคงเหลือ (ปี): ทั้งหมด</option>
      <option value="1">น้อยกว่า 1 ปี</option>
      <option value="1-2">1-2 ปี</option>
      <option value="2-3">2-3 ปี</option>
      <option value="3-4">3-4 ปี</option>
      <option value="4-5">4-5 ปี</option>
      <option value="5">มากกว่า 5 ปี</option>
    </select>

    <select id="filter-credit-comp">
      <option value="">เครดิต(บริษัท): ทั้งหมด</option>
      <option value="AAA">AAA</option>
      <option value="AA">AA</option>
      <option value="A">A</option>
      <option value="BBB">BBB</option>
      <option value="Unrated">Unrated</option>
    </select>

    <select id="filter-credit-bond">
      <option value="">เครดิต(ตราสาร): ทั้งหมด</option>
      <option value="AAA">AAA</option>
      <option value="AA">AA</option>
      <option value="A">A</option>
      <option value="BBB">BBB</option>
      <option value="Unrated">Unrated</option>
    </select>

    <select id="filter-investor">
      <option value="">นักลงทุน: ทั้งหมด</option>
      <option value="PO">ประชาชนทั่วไป (PO)</option>
      <option value="HNW">รายใหญ่/สถาบัน</option>
